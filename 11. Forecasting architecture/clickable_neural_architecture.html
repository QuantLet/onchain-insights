<script>
function rect(x, y, w, h, fill, line, width=2) {
    return {
        type: "rect",
        x0: x - w/2,
        x1: x + w/2,
        y0: y - h/2,
        y1: y + h/2,
        fillcolor: fill,
        line: {color: line, width: width},
        layer: "below"
    };
}

function label(x, y, text, size=13, color="#111827") {
    return {
        x: x,
        y: y,
        text: text,
        showarrow: false,
        font: {size: size, color: color},
        align: "center"
    };
}

function arrow(x0, y0, x1, y1, color="#374151") {
    return {
        x: x1,
        y: y1,
        ax: x0,
        ay: y0,
        xref: "x",
        yref: "y",
        axref: "x",
        ayref: "y",
        showarrow: true,
        arrowhead: 3,
        arrowsize: 1.1,
        arrowwidth: 2,
        arrowcolor: color
    };
}

function baseLayout(title) {
    return {
        title: {
            text: "<b>" + title + "</b>",
            x: 0.5,
            font: {size: 17}
        },
        width: 950,
        height: 360,
        paper_bgcolor: "white",
        plot_bgcolor: "white",
        margin: {l: 30, r: 30, t: 55, b: 25},
        xaxis: {range: [0, 10], visible: false, fixedrange: true},
        yaxis: {range: [0, 4], visible: false, fixedrange: true},
        shapes: [],
        annotations: []
    };
}

function drawTCN() {
    let layout = baseLayout("Dilated Temporal Causal Convolution Encoder");

    layout.shapes = [
        rect(1.0, 2.0, 1.2, 0.75, "#dbeafe", "#2563eb"),
        rect(2.7, 2.0, 1.25, 0.75, "#bfdbfe", "#1d4ed8"),
        rect(4.3, 2.0, 1.25, 0.75, "#bfdbfe", "#1d4ed8"),
        rect(5.9, 2.0, 1.25, 0.75, "#bfdbfe", "#1d4ed8"),
        rect(7.5, 2.0, 1.25, 0.75, "#dbeafe", "#2563eb"),
        rect(9.0, 2.0, 1.25, 0.75, "#dbeafe", "#2563eb")
    ];

    layout.annotations = [
        label(1.0, 2.0, "target<br>history"),
        label(2.7, 2.0, "causal conv<br>dilation 1"),
        label(4.3, 2.0, "causal conv<br>dilation 2"),
        label(5.9, 2.0, "causal conv<br>dilation 4"),
        label(7.5, 2.0, "multi-scale<br>summary"),
        label(9.0, 2.0, "horizon<br>tokens"),

        arrow(1.6, 2.0, 2.05, 2.0, "#2563eb"),
        arrow(3.32, 2.0, 3.68, 2.0, "#2563eb"),
        arrow(4.92, 2.0, 5.28, 2.0, "#2563eb"),
        arrow(6.52, 2.0, 6.88, 2.0, "#2563eb"),
        arrow(8.12, 2.0, 8.38, 2.0, "#2563eb"),

        label(
            5.0, 0.95,
            "Dilations expand the receptive field while preserving causal order.",
            12,
            "#4b5563"
        )
    ];

    Plotly.react("detail_diagram", [], layout, {displayModeBar: false});
}

        rect(6.9, 2.0, 1.2, 0.7, "#ede9fe", "#7c3aed"),

    layout.annotations = [

function drawPlaceholder() {
    let layout = baseLayout("Module details");
    layout.annotations = [
        label(
            5.0, 2.2,
            "Click a highlighted block in the main diagram<br>to show its internal module.",
            15,
            "#4b5563"
        )
    ];
    Plotly.react("detail_diagram", [], layout, {displayModeBar: false});
}

document.addEventListener("DOMContentLoaded", function() {
    drawPlaceholder();

    const mainPlot = document.getElementById("main_architecture");

    mainPlot.on("plotly_click", function(data) {
        if (!data.points || data.points.length === 0) {
            return;
        }

        const block = data.points[0].customdata;

        if (block === "tcn") {
            drawTCN();
        } else if (block === "grn") {
            drawGRN();
        } else if (block === "fusion") {
            drawFusion();
        }
    });
});
</script>
